name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      libnode_url:
        description: Override the default download URL for libnode.zip
        required: false
        type: string
  workflow_call:
    inputs:
      libnode_url:
        description: Override the default download URL for libnode.zip
        required: false
        type: string

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  LIBNODE_URL: "https://github.com/moluopro/libnode/releases/download/24.18.0/libnode.zip"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            arch: x64
            runner: windows-2022
            script: ./shell/build-windows.ps1 -Architecture x64 -Configuration Release -Fresh
            artifact_path: |
              example/addons/gode/binary/windows/x64/libgode_runtime.dll
              example/addons/gode/binary/windows/x64/node.dll
            editor_artifact_path: example/addons/gode/binary/editor/windows/x64/libgode_editor.dll
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
            script: ./shell/build-linux.sh --arch x64 --config Release --fresh
            artifact_path: example/addons/gode/binary/linux/x64/libgode_runtime.so
            editor_artifact_path: example/addons/gode/binary/editor/linux/x64/libgode_editor.so
          - platform: macos
            arch: arm64
            runner: macos-26
            script: ./shell/build-macos.sh --arch arm64 --config Release --deployment-target 10.15 --fresh
            artifact_path: example/addons/gode/binary/macos/arm64/libgode_runtime.dylib
            editor_artifact_path: example/addons/gode/binary/editor/macos/arm64/libgode_editor.dylib
          - platform: ios
            arch: arm64
            runner: macos-26
            script: ./shell/build-ios.sh --arch arm64 --config Release --deployment-target 16.0 --fresh
            artifact_path: example/addons/gode/binary/ios/arm64/libgode_runtime.dylib
            editor_artifact_path: ""
          - platform: android
            arch: arm64
            runner: macos-26
            script: ./shell/build-android.sh --arch arm64 --config Release --fresh
            artifact_path: example/addons/gode/binary/android/arm64/libgode_runtime.so
            editor_artifact_path: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install -r generator/requirements.txt

      - name: Mask libnode URL
        shell: bash
        env:
          LIBNODE_URL: ${{ inputs.libnode_url || env.LIBNODE_URL }}
        run: |
          if [ -n "$LIBNODE_URL" ]; then
            echo "::add-mask::$LIBNODE_URL"
          fi

      - name: Prepare libnode
        shell: bash
        env:
          LIBNODE_URL: ${{ inputs.libnode_url || env.LIBNODE_URL }}
        run: >
          ./.github/shell/prepare-libnode.sh
          --url "$LIBNODE_URL"

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ${{ matrix.script }}

      - name: Build Unix
        if: matrix.platform != 'windows'
        shell: bash
        run: ${{ matrix.script }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: gode-binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Upload editor binary
        if: ${{ matrix.editor_artifact_path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: gode-editor-binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.editor_artifact_path }}
          if-no-files-found: error

  package:
    name: Package plugin
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install -r generator/requirements.txt

      - name: Run generator
        run: python generator/generator.py

      - name: Download Windows
        uses: actions/download-artifact@v8
        with:
          name: gode-binary-windows-x64
          path: example/addons/gode/binary/windows/x64

      - name: Download Linux
        uses: actions/download-artifact@v8
        with:
          name: gode-binary-linux-x64
          path: example/addons/gode/binary/linux/x64

      - name: Download macOS
        uses: actions/download-artifact@v8
        with:
          name: gode-binary-macos-arm64
          path: example/addons/gode/binary/macos/arm64

      - name: Download iOS
        uses: actions/download-artifact@v8
        with:
          name: gode-binary-ios-arm64
          path: example/addons/gode/binary/ios/arm64

      - name: Download Android
        uses: actions/download-artifact@v8
        with:
          name: gode-binary-android-arm64
          path: example/addons/gode/binary/android/arm64

      - name: Download Windows editor
        uses: actions/download-artifact@v8
        with:
          name: gode-editor-binary-windows-x64
          path: example/addons/gode/binary/editor/windows/x64

      - name: Download Linux editor
        uses: actions/download-artifact@v8
        with:
          name: gode-editor-binary-linux-x64
          path: example/addons/gode/binary/editor/linux/x64

      - name: Download macOS editor
        uses: actions/download-artifact@v8
        with:
          name: gode-editor-binary-macos-arm64
          path: example/addons/gode/binary/editor/macos/arm64

      - name: Package plugin
        id: package
        shell: bash
        run: |
          ./.github/shell/package-plugin.sh
          echo "archive=dist/gode.zip" >> "$GITHUB_OUTPUT"

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: gode-plugin
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
